{% extends "base.html" %}
{% load static %}

{% block title %}Регистрация · {{ APP_NAME }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <section class="auth-shell">
        <article class="panel auth-card auth-card--single">
            <div class="auth-card__form auth-form-panel">
                <div class="auth-branding">
                    <span class="eyebrow">Secure signup</span>
                    <h1 class="auth-card__title">Secure Messenger</h1>
                </div>

                <div class="alert alert--error hidden" data-form-alert></div>

                <form class="form-stack" data-register-form novalidate>
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input
                            id="register-username"
                            name="username"
                            type="text"
                            autocomplete="username"
                            minlength="3"
                            maxlength="50"
                            placeholder="Введите username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input
                            id="register-email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="register-password">Пароль</label>
                        <input
                            id="register-password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            minlength="6"
                            placeholder="Минимум 6 символов"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password-confirm">Подтверждение пароля</label>
                        <input
                            id="password-confirm"
                            name="password_confirm"
                            type="password"
                            autocomplete="new-password"
                            minlength="6"
                            placeholder="Повторите пароль"
                            required
                        >
                    </div>

                    <button class="btn btn--primary btn--block" type="submit" data-submit-button>
                        Зарегистрироваться
                    </button>
                </form>

                <p class="auth-footer">
                    Уже есть аккаунт?
                    <a href="{% url 'accounts:login' %}">Войти</a>
                </p>
            </div>
        </article>
    </section>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/pages/register.js' %}" defer></script>
{% endblock %}
